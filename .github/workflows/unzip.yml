name: Unzip project
on: push
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip and clean up
        run: |
          if [ -f ledger-saas.zip ]; then
            unzip -o ledger-saas.zip -d .
            rm ledger-saas.zip
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "Unzip project files" || echo "Nothing to commit"
            git push
          fi
